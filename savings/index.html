<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예적금 만기 이자 계산기 - 세후 실수령액 자동 계산 | 만능툴박스</title>
    <meta name="description" content="단리, 복리, 일반과세(15.4%), 세금우대(1.4%)를 반영하여 만기 시 실제로 받는 세후 이자와 총 수령액을 정확하게 계산해 드립니다.">
    <meta name="keywords" content="예적금 계산기, 이자 계산기, 만기 이자 계산, 세후 이자 계산기, 적금 이자 계산기, 예금 실수령액, 비과세 이자 계산">
    <link rel="canonical" href="https://every-calc.co.kr/savings/">
    <meta name="robots" content="index, follow">
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="/css/savings.css">
    <meta property="og:type" content="website">
    <meta property="og:title" content="예적금 만기 이자 계산기 - 세후 실수령액 자동 계산">
    <meta property="og:description" content="단리, 복리, 일반과세(15.4%), 세금우대(1.4%)를 완벽 반영하여 만기 시 실제로 받는 진짜 세후 이자와 최종 수령액을 정확하게 계산해 보세요.">
    <meta property="og:image" content="https://every-calc.co.kr">
    <meta property="og:url" content="https://every-calc.co.kr/savings/">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png">
    <link rel="apple-touch-icon" href="/apple-icon-180x180.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div id="wrap">
        <div id="header" data-include="header.html"></div>
        <div id="gnb" data-include="gnb.html"></div>
        <main id="content">
            <section class="calculator-box">
                <h2>💰 예적금 만기 이자 계산기</h2>
                <p class="guide-text">예금(목돈 거치) 또는 적금(매월 적립)을 선택하고 금액과 금리를 입력해 주세요.</p>
                <form id="savings-form" class="form" onsubmit="return false;">
                    <!-- 1. 상품 유형 선택 -->
                    <div class="input-group-box">
                        <label class="p-0">상품 종류</label>
                        <div class="flex-radios">
                            <span class="radio"><label><input type="radio" name="product-type" value="deposit" checked> 정기예금 (목돈 굴리기)</label></span>
                            <span class="radio"><label><input type="radio" name="product-type" value="savings"> 정기적금 (매달 모으기)</label></span>
                        </div>
                    </div>
                    <!-- 2. 금액 및 기간 입력 (실시간 한글 단위 노출 영역 포함) -->
                    <div class="input-group-box">
                        <div class="item-box row-cols-xl">
                            <label id="amount-label" for="input-amount">예치 금액 (원)</label>
                            <input type="number" id="input-amount" placeholder="예: 10000000" required min="1" class="form-control">
                            <!-- 실시간 한글 금액 단위 팝업 그릇 -->
                            <p id="amount-korean"></p>
                        </div>
                        <div class="item-box">
                            <label for="input-rate">연 이자율 (%)</label>
                            <input type="number" id="input-rate" placeholder="예: 4.5" required min="0.1" step="0.01" class="form-control">
                            <label for="input-months">저축 기간 (개월)</label>
                            <input type="number" id="input-months" placeholder="예: 12" required min="1" class="form-control">
                        </div>
                    </div>
                    <!-- 3. 이자 계산 방식 및 과세 종류 -->
                    <div class="input-group-box">
                        <div class="item-box">
                            <label for="select-method">이자 계산 방식</label>
                            <select id="select-method" class="form-control">
                                <option value="simple" selected>단리</option>
                                <option value="compound">연복리</option>
                            </select>
                            <label for="select-tax">과세 종류</label>
                            <select id="select-tax" class="form-control">
                                <option value="normal" selected>일반과세 (15.4%)</option>
                                <option value="preferential">세금우대 (1.4%)</option>
                                <option value="free">비과세 (0%)</option>
                            </select>
                        </div>
                    </div>
                </form>
                <!-- 4. 실시간 금융 결과 영역 -->
                <div class="result-box financial-result">
                    <h3>💡 예상 만기 수령액</h3>
                    <div class="result-display">
                        <p>원금 합계: <span id="res-principal" style="color:var(--orange);font-weight: bold;">0</span> 원</p>
                        <p>세전 이자: <span id="res-interest-before" style="color:var(--green);font-weight: bold;">0</span> 원</p>
                        <p>이자소득세: <span id="res-tax" style="color:var(--red);font-weight: bold;">0</span> 원</p>
                        <hr class="dash">
                        <p class="final-amount" style="color: var(--blue);font-weight: bold;font-size: 110%;">최종 세후 수령액: <strong id="res-total">0</strong> 원</p>
                    </div>
                </div>
            </section>
            <div id="bottom-ad" class="bottom-ad" data-include="sub_bottom_ad.html"></div>
        </main>
        <div id="sidebar" data-include="sidebar.html"></div>
        <div id="footer" data-include="footer.html"></div>
    </div>
    <script src="/js/common.js"></script>
    <script>
        // js/savings.js
        document.addEventListener('DOMContentLoaded', () => {
            // DOM 요소 캐싱
            const form = document.getElementById('savings-form');
            const productTypes = document.getElementsByName('product-type');
            const amountLabel = document.getElementById('amount-label');

            const inputAmount = document.getElementById('input-amount');
            const amountKorean = document.getElementById('amount-korean');
            const inputRate = document.getElementById('input-rate');
            const inputMonths = document.getElementById('input-months');
            const selectMethod = document.getElementById('select-method');
            const selectTax = document.getElementById('select-tax');

            const resPrincipal = document.getElementById('res-principal');
            const resInterestBefore = document.getElementById('res-interest-before');
            const resTax = document.getElementById('res-tax');
            const resTotal = document.getElementById('res-total');

            // 1. 라디오 버튼 선택 변환 이벤트 (예금 vs 적금 라벨 교체)
            productTypes.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'deposit') {
                        amountLabel.textContent = '예치 금액 (원)';
                        inputAmount.placeholder = '예: 10000000 (목돈)';
                    } else {
                        amountLabel.textContent = '월 적립 금액 (원)';
                        inputAmount.placeholder = '예: 500000 (매달)';
                    }
                    calculateSavings();
                });
            });

            // 2. 숫자를 한글 금액 단위로 쪼개주는 단위 변환 로직
            function convertToKoreanWon(number) {
                if (!number || isNaN(number)) return '';
                if (number === 0) return '0원';

                const units = ['', '만', '억', '조', '경'];
                let result = [];
                let numStr = Math.floor(number).toString();

                let len = numStr.length;
                let unitIndex = 0;

                while (len > 0) {
                    let start = Math.max(0, len - 4);
                    let chunk = parseInt(numStr.substring(start, len), 10);

                    if (chunk > 0) {
                        result.unshift(chunk.toLocaleString() + units[unitIndex]);
                    }
                    unitIndex++;
                    len -= 4;
                }
                return result.join(' ') + ' 원';
            }

            // 3. 메인 금융 계산 엔진 함수
            function calculateSavings() {
                const type = document.querySelector('input[name="product-type"]:checked').value;
                const amount = parseFloat(inputAmount.value) || 0;
                const rate = (parseFloat(inputRate.value) || 0) / 100; // 백분율 변환
                const months = parseInt(inputMonths.value) || 0;
                const method = selectMethod.value;
                const taxType = selectTax.value;

                // 한글 실시간 단위 가이드 텍스트 출력 트리거
                if (amount > 0) {
                    amountKorean.textContent = '👉 ' + convertToKoreanWon(amount);
                } else {
                    amountKorean.textContent = '';
                }

                // 필수 값 누락 시 결과 영역 초기화
                if (amount <= 0 || rate <= 0 || months <= 0) {
                    clearResults();
                    return;
                }

                let principal = 0;
                let interestBefore = 0;

                // 예금 vs 적금 및 단리 vs 복리 연산 공식 분기
                if (type === 'deposit') {
                    principal = amount;
                    if (method === 'simple') {
                        interestBefore = principal * rate * (months / 12);
                    } else {
                        interestBefore = principal * Math.pow(1 + rate, months / 12) - principal;
                    }
                } else {
                    principal = amount * months;
                    if (method === 'simple') {
                        interestBefore = amount * (months * (months + 1) / 2) * (rate / 12);
                    } else {
                        const monthlyRate = rate / 12;
                        let totalWithInterest = 0;
                        for (let i = 1; i <= months; i++) {
                            totalWithInterest += amount * Math.pow(1 + monthlyRate, i);
                        }
                        interestBefore = totalWithInterest - principal;
                    }
                }

                // 세율 정의 (일반과세 15.4% / 세금우대 1.4% / 비과세 0%)
                let taxRate = 0.154;
                if (taxType === 'preferential') taxRate = 0.014;
                else if (taxType === 'free') taxRate = 0;

                const tax = interestBefore * taxRate;
                const totalAfter = principal + (interestBefore - tax);

                // 정수 절사 후 세 자릿수 콤마(toLocaleString) 찍어 화면단 렌더링
                resPrincipal.textContent = Math.floor(principal).toLocaleString();
                resInterestBefore.textContent = Math.floor(interestBefore).toLocaleString();
                resTax.textContent = Math.floor(tax).toLocaleString();
                resTotal.textContent = Math.floor(totalAfter).toLocaleString();
            }

            function clearResults() {
                resPrincipal.textContent = '0';
                resInterestBefore.textContent = '0';
                resTax.textContent = '0';
                resTotal.textContent = '0';
            }

            // 4. 입력 변화 감지 실시간 이벤트 리스너 바인딩
            form.addEventListener('input', calculateSavings);
            selectMethod.addEventListener('change', calculateSavings);
            selectTax.addEventListener('change', calculateSavings);
        });

    </script>
</body>
</html>
