<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인스타그램 피드 이미지 분할기 - 3분할 9분할 바둑판 자르기 | 에브리캘크</title>
    <meta name="description" content="인스타 감성 피드 조립을 위해 이미지를 가로 3분할, 6분할, 9분할 바둑판 형태로 부드럽고 정확하게 잘라내고 조각별로 다운로드할 수 있는 캔버스 유틸리티입니다.">
    <meta name="keywords" content="인스타 분할기, 이미지 3분할, 피드 자르기, 인스타 9분할, 사진 바둑판 자르기, 인스타그램 그리드, 피드 분할 프로그램">
    <link rel="canonical" href="https://every-calc.co.kr/insta-splitter/">
    <meta name="robots" content="index, follow">
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="/css/insta-splitter.css">
    <meta property="og:type" content="website">
    <meta property="og:title" content="인스타그램 피드 이미지 분할기 - 바둑판 자르기 툴">
    <meta property="og:description" content="큰 사진 한 장을 인스타 피드 규격에 맞춰 3분할, 6분할, 9분할로 깔끔하게 슬라이싱하세요. 로그인 없이 브라우저에서 바로 다운로드 가능!">
    <meta property="og:image" content="https://every-calc.co.kr/img/everycalc.png">
    <meta property="og:url" content="https://every-calc.co.kr/insta-splitter/">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png">
    <link rel="apple-touch-icon" href="/apple-icon-180x180.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div id="wrap">
        <header id="header" data-include="header.html"></header>
        <div id="gnb" data-include="gnb.html"></div>
        <main id="content">
            <div class="calculator-box">
                <h2>📸 인스타그램 피드 이미지 분할기</h2>
                <p>업로드한 이미지를 인스타 가로 3열 레이아웃에 맞춰 정사각형 조각으로 쪼갭니다. 피드 업로드 순서대로 번호가 지정됩니다.</p>
                <form id="splitter-form" class="form" onsubmit="return false;">
                    <!-- 1. 이미지 파일 업로드 -->
                    <div class="input-group-box">
                        <h3>1. 원본 이미지 업로드</h3>
                        <div class="input-item">
                            <input type="file" id="image-input" accept="image/*" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;">
                        </div>
                    </div>
                    <!-- 2. 분할 방식 선택 옵션 -->
                    <div class="input-group-box">
                        <h3>2. 분할 그리드 방식 설정</h3>
                        <div class="input-item">
                            <label for="split-row">자르고 싶은 세로 칸 수 (가로는 3칸 고정)</label>
                            <select id="split-row" class="form-control">
                                <option value="1">가로 3분할 (조각 3개 - 가로형 피드)</option>
                                <option value="2">가로 3열 x 세로 2단 (조각 6개)</option>
                                <option value="3" selected>가로 3열 x 세로 3단 (조각 9개 - 추천 정사각형 바둑판)</option>
                                <option value="4">가로 3열 x 세로 4단 (조각 12개)</option>
                            </select>
                        </div>
                    </div>
                </form>
                <!-- 3. 분할 미리보기 및 다운로드 결과창 -->
                <div class="result-box" id="result-area" style="display:none;">
                    <h3>💡 이미지 분할 미리보기 (조각별 다운로드)</h3>
                    <p class="guide-text" style="color:var(--red)">
                        * 인스타 피드에는 <strong>우측 하단의 마지막 번호(가장 큰 번호)</strong> 조각부터 역순으로 업로드해야 모양이 맞춰집니다!
                    </p>
                    <!-- 분할된 이미지가 동적으로 박힐 컨테이너 -->
                    <div id="preview-grid" class="preview-grid-container"></div>
                </div>
            </div>
            <div id="bottom-ad" class="bottom-ad" data-include="sub_bottom_ad.html"></div>
        </main>
        <div id="sidebar" data-include="sidebar.html"></div>
        <footer id="footer" data-include="footer.html"></footer>
    </div>
    <script src="/js/common.js"></script>
    <script>
        $(document).ready(function () {
            let loadedImage = null;

            // 파일 인풋 등록 및 변동 처리
            $('#image-input').on('change', function (e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function (event) {
                    loadedImage = new Image();
                    loadedImage.onload = function () {
                        processImageSplitting();
                    };
                    loadedImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // 옵션 변동 시 실시간 그리드 재가공
            $('#split-row').on('change', function () {
                if (loadedImage) processImageSplitting();
            });

            // [핵심] 이미지 크롭 및 조각화 프로세서
            function processImageSplitting() {
                if (!loadedImage) return;

                const cols = 3; // 인스타그램 가로 레이아웃 고정 상수
                const rows = parseInt($('#split-row').val()) || 3;
                const gridContainer = $('#preview-grid');

                gridContainer.empty(); // 기존 격자 초기화
                $('#result-area').show();

                // 원본 소스 이미지의 규격 계산
                const imgW = loadedImage.width;
                const imgH = loadedImage.height;

                // 조각 하나당 매칭될 가상 정사각형 단면 픽셀 길이 산출
                const pieceW = imgW / cols;
                const pieceH = imgH / rows;

                let index = 1;

                // 이중 루프 돌며 순차대로 영역을 잘라내어 캔버스 덤프 추출
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        // 메모리상에 독립 동적 캔버스 생성
                        const canvas = document.createElement('canvas');
                        canvas.width = pieceW;
                        canvas.height = pieceH;
                        const ctx = canvas.getContext('2d');

                        // drawImage(소스이미지, 시작X, 시작Y, 자를폭, 자를높이, 대상X, 대상Y, 그릴폭, 그릴높이)
                        ctx.drawImage(loadedImage, c * pieceW, r * pieceH, pieceW, pieceH, 0, 0, pieceW, pieceH);

                        // 잘라낸 그래픽 데이터를 주소 이미지 포맷(DataURL)으로 최종 파싱
                        const dataURL = canvas.toDataURL('image/jpeg', 0.9);

                        // 화면 뷰포트에 붙일 마크업 블록 조립
                        const gridBox = $(`
                            <div class="grid-box">
                                <img src="${dataURL}" alt="조각 ${index}">
                                <button type="button" class="btn-download-piece" data-index="${index}">💾 ${index}번</button>
                            </div>
                        `);

                        // 개별 다운로드 액션 바인딩
                        gridBox.find('.btn-download-piece').on('click', function () {
                            const idx = $(this).data('index');
                            const link = document.createElement('a');
                            link.download = `every_calc_insta_feed_${idx}.jpg`;
                            link.href = dataURL;
                            link.click();
                        });

                        gridContainer.append(gridBox);
                        index++;
                    }
                }
            }

</body>
</html>
