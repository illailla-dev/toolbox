<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주휴수당 계산기 - 알바 주급 및 실수령액 자동 계산 | 에브리캘크</title>
    <meta name="description" content="시급과 일주일 근무 시간을 입력하면 법정 주휴수당 포함 여부를 자동 판별하고, 3.3% 원천세 및 고용보험을 제외한 실제 주급·월급 실수령액을 정확히 계산해 드립니다.">
    <meta name="keywords" content="주휴수당 계산기, 알바 계산기, 주휴수당 조건, 주급 계산기, 실수령액 계산기, 3.3% 계산, 고용보험 공제, 단기알바 주휴수당">
    <link rel="canonical" href="https://every-calc.co.kr/weekly-holiday-pay/">
    <meta name="robots" content="index, follow">
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="/css/weekly-holiday-pay.css">
    <meta property="og:type" content="website">
    <meta property="og:title" content="주휴수당 및 알바 실수령액 계산기">
    <meta property="og:description" content="이번 주 내 알바비는 얼마일까? 주 15시간 이상 근무 시 지급되는 주휴수당과 세금 공제 내역을 실시간으로 확인해 보세요.">
    <meta property="og:image" content="https://every-calc.co.kr">
    <meta property="og:url" content="https://every-calc.co.kr/weekly-holiday-pay/">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png">
    <link rel="apple-touch-icon" href="/apple-icon-180x180.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div id="wrap">
        <header id="header" data-include="header.html"></header>
        <div id="gnb" data-include="gnb.html"></div>
        <main id="content">
            <div class="calculator-box">
                <h2>💸 주휴수당 및 알바 실수령액 계산기</h2>
                <p>시급과 하루 근무 시간, 일주일 출근 일수를 입력하시면 법정 기준에 맞는 주휴수당과 최종 실수령 주급/월급을 실시간 연산합니다.</p>
                <form id="wage-form" class="form" onsubmit="return false;">
                    <!-- 1. 근무 조건 입력 -->
                    <div class="input-group-box">
                        <h3>1. 근무 조건 입력</h3>
                        <div class="form-row">
                            <div class="col-xl input-item">
                                <label for="hourly-wage">올해 법정 기준 시급 (원)</label>
                                <input type="number" id="hourly-wage" class="form-control" placeholder="예: 10030" value="10030" required min="1">
                            </div>
                            <div class="col-xl input-item">
                                <label for="daily-hours">하루 근무 시간 (시간)</label>
                                <input type="number" id="daily-hours" class="form-control" placeholder="예: 8" required min="1" max="24" step="0.1">
                            </div>
                            <div class="col-xl input-item">
                                <label for="weekly-days">일주일 출근 일수 (일)</label>
                                <input type="number" id="weekly-days" class="form-control" placeholder="예: 5" required min="1" max="7" step="1">
                            </div>
                        </div>
                    </div>
                    <!-- 2. 공제 세금 및 정산 방식 선택 -->
                    <div class="input-group-box">
                        <h3>2. 세금 공제 및 정산 옵션</h3>
                        <div class="input-item">
                            <label for="tax-select">세금 공제 방식</label>
                            <select id="tax-select" class="form-control" style="margin-bottom:15px;">
                                <option value="0" selected>미공제 (세전 금액 전체 수령)</option>
                                <option value="3.3">사업소득세 프리랜서 공제 (3.3%)</option>
                                <option value="0.9">일반 알바 고용보험만 공제 (0.9%)</option>
                            </select>
                            <label>📅 정산 기간 선택</label>
                            <div class="flex-radios">
                                <div class="radio">
                                    <label>
                                        <input type="radio" name="period-type" value="week" checked> 주급 기준 보기
                                    </label>
                                </div>
                                <div class="radio">
                                    <label>
                                        <input type="radio" name="period-type" value="month"> 월급 기준 보기 (주 4.34주 환산)
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
                <!-- 3. 실시간 결과 출력 영역 -->
                <div class="result-box">
                    <h3>💡 급여 정산 예측 결과</h3>
                    <div class="result-display">
                        <p>기본 근로 수당: <strong id="res-base-wage">0</strong> 원</p>
                        <p>예상 법정 주휴수당: <strong id="res-holiday-pay">0</strong> 원</p>
                        <p id="holiday-status-text" style="font-weight: bold;"></p>
                        <hr>
                        <p>세전 총 급여액: <strong id="res-total-pretax">0</strong> 원</p>
                        <p>공제되는 세금액: <strong id="res-total-tax">0</strong> 원</p>
                        <hr>
                        <p style="font-size:110%; color:var(--blue); font-weight:bold;">🎯 최종 세후 실수령액: <span id="res-net-pay">0</span> 원</p>
                    </div>
                    <p class="result-tip guide-text mt-3">* 근로기준법상 주 15시간 이상 근무하고 다음 주 출근이 예정되어 있을 때 주휴수당 지급 대상이 됩니다.</p>
                </div>
            </div>
            <div id="bottom-ad" class="bottom-ad" data-include="sub_bottom_ad.html"></div>
        </main>
        <div id="sidebar" data-include="sidebar.html"></div>
        <footer id="footer" data-include="footer.html"></footer>
    </div>
    <script src="/js/common.js"></script>
    <script>

        $(document).ready(function () {
            // 모든 인풋 데이터 실시간 트래킹 변동 감지
            $('#wage-form').on('input change', calculateWage);

            function calculateWage() {
                const hourlyWage = parseFloat($('#hourly-wage').val()) || 0;
                const dailyHours = parseFloat($('#daily-hours').val()) || 0;
                const weeklyDays = parseFloat($('#weekly-days').val()) || 0;
                const taxRate = parseFloat($('#tax-select').val()) || 0;
                const period = $('input[name="period-type"]:checked').val();

                // 총 주당 근로시간 계산
                const totalWeeklyHours = dailyHours * weeklyDays;

                // 1. 기본 주당 근로 수당
                let baseWeeklyWage = hourlyWage * totalWeeklyHours;

                // 2. 주휴수당 조건문 판별 (주 15시간 이상일 때만 양산)
                let holidayWeeklyPay = 0;
                if (totalWeeklyHours >= 15) {
                    // 근로기준법상 상한선 주 40시간 제한 캡(Cap) 적용 안전망 구축
                    const checkedHours = totalWeeklyHours > 40 ? 40 : totalWeeklyHours;
                    holidayWeeklyPay = Math.round((checkedHours / 40) * 8 * hourlyWage);
                    $('#holiday-status-text').text('✅ 주 15시간 이상 근무로 주휴수당 지급 대상입니다.').css('color', 'var(--green)');
                } else {
                    holidayWeeklyPay = 0;
                    if (totalWeeklyHours > 0) {
                        $('#holiday-status-text').text('❌ 주 15시간 미만 근무로 주휴수당이 발생하지 않습니다.').css('color', 'var(--red)');
                    } else {
                        $('#holiday-status-text').text('');
                    }
                }

                // 3. 기간별(주급/월급) 스케일링 가중치 반영 (한 달 평균 4.345주 적용 기준법 기준)
                const multiplier = (period === 'month') ? 4.345 : 1.0;

                const finalBaseWage = Math.floor(baseWeeklyWage * multiplier);
                const finalHolidayPay = Math.floor(holidayWeeklyPay * multiplier);
                const totalPreTax = finalBaseWage + finalHolidayPay;

                // 4. 세금 원천징수 차감 계산
                const totalTax = Math.floor(totalPreTax * (taxRate / 100));
                const netPay = totalPreTax - totalTax;

                // 5. UI 가시화 세자리 콤마 바인딩 출력
                $('#res-base-wage').text(finalBaseWage.toLocaleString());
                $('#res-holiday-pay').text(finalHolidayPay.toLocaleString());
                $('#res-total-pretax').text(totalPreTax.toLocaleString());
                $('#res-total-tax').text(totalTax.toLocaleString());
                $('#res-net-pay').text(netPay.toLocaleString());
            }
        });
    </script>
</body>
</html>
