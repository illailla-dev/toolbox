<div class="container">
    <h1><a href="/"><img src="/img/logo.png" alt="EVERY CALC!"></a></h1>
    <!-- 🔍 에브리캘크 전용 초고속 검색 컴포넌트 -->
    <div id="search-wrapper">
        <div class="input-group">
            <!-- 필수 규칙: 부트스트랩 .form-control 규격 적용 -->
            <input type="text" id="calc-search-input" class="form-control" placeholder="🔍 필요한 부업 / 세금 계산기 검색... (예: 쿠팡, 이자, 3.3)" autocomplete="off">
        </div>
        <!-- 실시간 동적 검색 결과가 출력되는 절대좌표 앵커 박스 -->
        <div id="calc-search-results" style="display: none; position: relative; width: 100%;"></div>
    </div>
    <div class="action-area">
        <button id="btn-bookmark-site" class="btn green"><i>⭐</i> 즐겨찾기</button>
        <button id="btn-share-site" class="btn red">공유하기</button>
        <button id="toggle-open" class="btn icon"><i class="bi bi-list"></i></button>
    </div>
</div>
