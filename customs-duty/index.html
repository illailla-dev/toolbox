<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직구 관부가세 및 환율 계산기 - 해외직구 세금 자동 계산 | 에브리캘크</title>
    <meta name="description" content="해외직구 물품 가격과 배송비, 국가 및 품목을 입력하면 실시간 환율을 반영하여 면세 여부와 예상 관세, 부가세, 최종 총액을 정확하게 계산해 드립니다.">
    <meta name="keywords" content="직구 계산기, 관부가세 계산기, 해외직구 관세, 관부가세 면세한도, 미국 직구 관세, 부가세 계산기, 직구 세금">
    <link rel="canonical" href="https://every-calc.co.kr/ustoms-duty/">
    <meta name="robots" content="index, follow">
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/customs-duty.js"></script>
    <link rel="stylesheet" href="/css/customs-duty.css">
    <meta property="og:type" content="website">
    <meta property="og:title" content="직구 관부가세 및 환율 계산기 - 세금 자동 계산">
    <meta property="og:description" content="물품가와 국가만 선택하면 면세 한도 초과 여부와 예상 관부가세를 한눈에 확인하고 알뜰한 해외직구를 설계해 보세요.">
    <meta property="og:image" content="https://every-calc.co.kr">
    <meta property="og:url" content="https://every-calc.co.kr/customs-duty/">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png">
    <link rel="apple-touch-icon" href="/apple-icon-180x180.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div id="wrap">
        <header id="header" data-include="header.html"></header>
        <div id="gnb" data-include="gnb.html"></div>
        <main id="content">
            <div class="calculator-box">
                <h2>✈️ 직구 관부가세 및 환율 계산기</h2>
                <p>해외 구매 가격과 구입 국가, 품목을 선택하시면 세관 통과 시 발생할 예상 세금을 실시간으로 연산합니다.</p>
                <form id="customs-form" class="form" onsubmit="return false;">
                    <!-- 1. 구매 국가 및 환율 세팅 -->
                    <div class="input-group-box">
                        <h3>1. 구매 국가 및 적용 환율</h3>
                        <div class="item-box">
                            <label for="country-type">구입 국가 (면세 한도 기준)</label>
                            <select id="country-type" class="form-control">
                                <option value="USA">미국 (목록통관 기준 $200 이하 면세)</option>
                                <option value="OTHER">미국 외 국가 (유럽/중국/일본 등 $150 이하 면세)</option>
                            </select>
                        </div>
                        <div class="item-box">
                            <label for="exchange-rate">현재 적용 환율 (원화 환산용)</label>
                            <input type="number" id="exchange-rate" placeholder="예: 1350" value="1380" required min="1" step="0.1" class="form-control">
                        </div>
                    </div>
                    <!-- 2. 물품 정보 및 가격 입력 -->
                    <div class="input-group-box">
                        <h3>2. 물품 정보 및 가격 입력 ($ 기준)</h3>
                        <div class="item-box">
                            <label for="item-type">물품 품목 (관세율 기준)</label>
                            <select id="item-type" class="form-control">
                                <option value="8">일반 의류 / 패션잡화 (관세 8%)</option>
                                <option value="13">신발류 (관세 13%)</option>
                                <option value="0">전자기기 / 컴퓨터 / 스마트폰 (관세 0% 면제)</option>
                                <option value="10">화장품 / 미용용품 (관세 10%)</option>
                                <option value="8">기타 일반 물품 (관세 8%)</option>
                            </select>
                        </div>
                    </div>
                    <div class="item-box">
                        <label for="product-price">물품 구매 가격 (USD $)</label>
                        <input type="number" id="product-price" placeholder="예: 120" required min="0" step="0.01" class="form-control">
                    </div>
                    <div class="item-box">
                        <label for="shipping-fee">현지 + 국제 배송비 (USD $)</label>
                        <input type="number" id="shipping-fee" placeholder="예: 15" value="0" required min="0" step="0.01" class="form-control">
                    </div>
                </form>
                <!-- 3. 실시간 결과 출력 영역 -->
                <div class="result-box">
                    <h3>💡 관부가세 모의 계산 결과</h3>
                    <div class="result-display">
                        <p>총 과세 대상 금액: <strong>$ <span id="res-total-usd">0</span></strong> (<span id="res-total-krw">0</span> 원)</p>
                        <p>면세 한도 여부: <strong id="res-tax-status" style="color: var(--green);">확인 중</strong></p>
                        <hr>
                        <p>예상 관세 (원): <strong id="res-customs-duty" style="color: var(--orange);">0</strong> 원</p>
                        <p>예상 부가세 (원): <strong id="res-value-added-tax" style="color: var(--purple);">0</strong> 원</p>
                        <p style="font-size: 110%; color: var(--blue); font-weight: bold;">최종 예상 납부 세금 총액: <strong id="res-total-tax">0</strong> 원</p>
                    </div>
                    <p class="result-tip guide-text mt-3">* 목록통관 기준 계산이며, 품목별 세부 분류에 따라 오차가 있을 수 있습니다.</p>
                </div>
            </div>
            <div id="bottom-ad" class="bottom-ad" data-include="sub_bottom_ad.html"></div>
        </main>
        <div id="sidebar" data-include="sidebar.html"></div>
        <footer id="footer" data-include="footer.html"></footer>
    </div>
    <script src="/js/common.js"></script>
</body>
</html>
