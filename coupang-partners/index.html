<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠팡 파트너스 정산 계산기 - 제휴 마케팅 세후 실수령액 계산 | 에브리캘크</title>
    <meta name="description" content="쿠팡 파트너스 및 제휴 마케팅 누적 매출액에 따른 수익금, 플랫폼 수수료, 원천세(3.3% / 8.8%) 공제 후 최종 세후 실수령액을 실시간으로 정확하게 계산합니다.">
    <meta name="keywords" content="쿠팡파트너스 계산기, 정산 계산기, 제휴마케팅 수익 계산, 쿠파스 실수령액, 3.3% 계산기, 사업소득 정산, 마케팅 수익금">
    <link class="canonical" href="https://every-calc.co.kr/coupang-partners/">
    <meta name="robots" content="index, follow">
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="/css/coupang-partners.css">
    <meta property="og:type" content="website">
    <meta property="og:title" content="쿠팡 파트너스 정산 계산기 - 세후 실수령액 자동 계산">
    <meta property="og:description" content="누적 매출액과 수익률, 원천세 유형만 선택하면 매달 정산받을 진짜 세후 수익금과 공제 내역을 투명하게 계산해 드립니다.">
    <meta property="og:image" content="https://every-calc.co.kr">
    <meta property="og:url" content="https://every-calc.co.kr/coupang-partners/">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png">
    <link rel="apple-touch-icon" href="/apple-icon-180x180.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div id="wrap">
        <header id="header" data-include="header.html"></header>
        <div id="gnb" data-include="gnb.html"></div>
        <main id="content">
            <div class="calculator-box">
                <h2>📦 쿠팡 파트너스 / 마케팅 정산 계산기</h2>
                <p>발생한 총 구매액(매출) 또는 세전 수익금을 기반으로 플랫폼 수수료와 세금을 제한 최종 세후 입금액을 모의 계산합니다.</p>
                <form id="coupang-form" class="form" onsubmit="return false;">
                    <!-- 1. 입력 방식 선택 -->
                    <div class="input-group-box">
                        <h3>1. 계산 방식 선택</h3>
                        <div class="flex-radios">
                            <div class="radio">
                                <label>
                                    <input type="radio" name="calc-type" value="sales" checked> 총 발생 매출 기준 (추천)
                                </label>
                            </div>
                            <div class="radio">
                                <label>
                                    <input type="radio" name="calc-type" value="revenue"> 세전 수익금 바로 입력
                                </label>
                            </div>
                        </div>
                    </div>
                    <!-- 2. 금액 및 요율 입력 (금액 입력단) -->
                    <div class="input-group-box">
                        <h3>2. 정산 데이터 입력</h3>
                        <!-- 총 매출액 입력 필드 (기본 활성화) -->
                        <div id="field-sales">
                            <div class="input-item mb-3">
                                <label for="total-sales">총 발생 매출액 (원)</label>
                                <input type="number" id="total-sales" placeholder="예: 10000000" min="0" step="1" class="form-control">
                            </div>
                            <div class="input-item mb-3">
                                <label for="commission-rate">수익 요율 (%)</label>
                                <select id="commission-rate" class="form-control">
                                    <option value="3">3.0% (쿠팡 파트너스 기본)</option>
                                    <option value="4">4.0% (쿠팡 파트너스 가입첫달/추천인)</option>
                                    <option value="1">1.0% (쿠팡 파트너스 추가 보너스)</option>
                                    <option value="custom">직접 입력</option>
                                </select>
                                <input type="number" id="custom-rate" placeholder="직접 입력(%) 예: 5" min="0" step="0.1" class="form-control mt-2" style="display:none;">
                            </div>
                        </div>
                        <!-- 세전 수익금 직접 입력 필드 (기본 숨김) -->
                        <div id="field-revenue" style="display:none;">
                            <div class="input-item mb-3">
                                <label for="pre-tax-revenue">세전 수익금 (원)</label>
                                <input type="number" id="pre-tax-revenue" placeholder="예: 300000" min="0" step="1" class="form-control">
                            </div>
                        </div>
                        <!-- 세금 유형 선택 -->
                        <div class="input-item">
                            <label for="tax-type">세금 징수 유형</label>
                            <select id="tax-type" class="form-control">
                                <option value="3.3">인적용역 사업소득세 (3.3%) - 일반적인 경우</option>
                                <option value="8.8">기타소득세 (8.8%) - 원고료 등</option>
                                <option value="0">비과세 / 법인·개인사업자 정산 (0%)</option>
                            </select>
                        </div>
                    </div>
                </form>
                <!-- 3. 실시간 결과 출력 영역 -->
                <div class="result-box">
                    <h3>💡 최종 정산 예측</h3>
                    <div class="result-display">
                        <p>예상 세전 수익금: <strong id="result-pre-tax" style="color: var(--orange);">0</strong> 원</p>
                        <p>공제되는 세금 (원천징수): <strong id="result-tax" style="color: var(--green)">0</strong> 원</p>
                        <hr>
                        <p id="result-total-money" style="font-size: 110%; color: var(--blue); font-weight: bold;">최종 세후 실수령액: <strong id="result-net-salary">0</strong> 원</p>
                        <p class="result-tip guide-text mt-3">* 매달 누적 정산금액이 1만원 미만인 경우 다음 달로 이월될 수 있습니다.</p>
                    </div>
                </div>
            </div>
            <div id="bottom-ad" class="bottom-ad" data-include="sub_bottom_ad.html"></div>
        </main>
        <div id="sidebar" data-include="sidebar.html"></div>
        <footer id="footer" data-include="footer.html"></footer>
    </div>
    <script src="/js/common.js"></script>
    <script>
        $(document).ready(function () {
            // 계산 방식 라디오 버튼 체인지 이벤트
            $('input[name="calc-type"]').on('change', function () {
                if ($(this).val() === 'sales') {
                    $('#field-sales').show();
                    $('#field-revenue').hide();
                } else {
                    $('#field-sales').hide();
                    $('#field-revenue').show();
                }
                calculateCoupang();
            });

            // 수수료율 셀렉트 박스 직접입력 분기 처리
            $('#commission-rate').on('change', function () {
                if ($(this).val() === 'custom') {
                    $('#custom-rate').show();
                } else {
                    $('#custom-rate').hide();
                }
                calculateCoupang();
            });

            // 입력 폼 내의 모든 값 변동 감지하여 실시간 계산 수행
            $('#coupang-form').on('input change', calculateCoupang);

            function calculateCoupang() {
                const calcType = $('input[name="calc-type"]:checked').val();
                const taxType = parseFloat($('#tax-type').val()) || 0;

                let preTaxRevenue = 0;

                // 1. 세전 수익금 결정 단계
                if (calcType === 'sales') {
                    const totalSales = parseFloat($('#total-sales').val()) || 0;
                    let rate = $('#commission-rate').val();

                    if (rate === 'custom') {
                        rate = parseFloat($('#custom-rate').val()) || 0;
                    } else {
                        rate = parseFloat(rate) || 0;
                    }

                    preTaxRevenue = totalSales * (rate / 100);
                } else {
                    preTaxRevenue = parseFloat($('#pre-tax-revenue').val()) || 0;
                }

                // 2. 세금 및 실수령액 계산 단계
                const taxAmount = preTaxRevenue * (taxType / 100);
                const netSalary = preTaxRevenue - taxAmount;

                // 3. UI 바인딩 및 원화 세자리 콤마 포맷팅
                $('#result-pre-tax').text(Math.floor(preTaxRevenue).toLocaleString());
                $('#result-tax').text(Math.floor(taxAmount).toLocaleString());
                $('#result-net-salary').text(Math.floor(netSalary).toLocaleString());
            }
        });
    </script>
</body>
</html>
