<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 폰트 다이어트 - 한글 서브셋(Subset) 유니코드 생성기 | 에브리캘크</title>
    <meta name="description" content="용량이 큰 한글 폰트(TTF/OTF) 최적화를 위해 웹 서브셋 폰트 제작용 핵심 2,350자 텍스트 및 CSS unicode-range 범위를 실시간으로 추출하고 생성해 드립니다.">
    <meta name="keywords" content="웹폰트 다이어트, 서브셋 폰트, 서브셋 생성기, font subset, 한글 2350자, unicode-range, 웹 최적화, 폰트 용량 줄이기">
    <link rel="canonical" href="https://every-calc.co.kr/font-subset/">
    <meta name="robots" content="index, follow">
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/font-subset.js"></script>
    <link rel="stylesheet" href="/css/font-subset.css">
    <meta property="og:type" content="website">
    <meta property="og:title" content="웹 폰트 다이어트 - 한글 서브셋 유니코드 생성기">
    <meta property="og:description" content="웹페이지 로딩 속도를 올리는 폰트 용량 다이어트! 완성형 한글 핵심 2,350자 추출과 CSS 유니코드 범위를 한 번에 해결하세요.">
    <meta property="og:image" content="https://every-calc.co.kr">
    <meta property="og:url" content="https://every-calc.co.kr/font-subset/">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png">
    <link rel="apple-touch-icon" href="/apple-icon-180x180.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div id="wrap">
        <header id="header" data-include="header.html"></header>
        <div id="gnb" data-include="gnb.html"></div>
        <main id="content">
            <div class="calculator-box">
                <h2>🔤 웹 폰트 다이어트 (Subset 생성기)</h2>
                <p>용량이 큰 한글 폰트 파일(보통 2~5MB)을 다이어트시키기 위한 툴입니다. 깨짐 없는 서브셋 제작을 위한 최적의 완성형 한글 코드를 제공합니다.</p>
                <div class="form">
                    <!-- 1. 옵션 선택 영역 -->
                    <div class="input-group-box">
                        <h3>1. 추출 옵션 선택</h3>
                        <div class="input-item">
                            <label for="subset-type">추출할 한글 서브셋 범위</label>
                            <select id="subset-type" class="form-control">
                                <option value="ksx1001">국가 표준 현대 한글 핵심 2,350자 (가장 추천 / 용량 80% 감소)</option>
                                <option value="basic-chars">상위 빈출 현대 한글 300자 + 영문/숫자/기호 (초경량 버전)</option>
                            </select>
                        </div>
                    </div>
                    <!-- 2. 결과 텍스트 추출 단 (클립보드 복사 유도형 레이아웃) -->
                    <div class="input-group-box">
                        <h3>2. 생성된 서브셋 프리셋 글자 리스트</h3>
                        <div class="input-item">
                            <textarea id="raw-text-area" rows="6" class="form-control" readonly></textarea>
                            <button type="button" id="btn-copy-text" class="btn blue btn-block mt-2">📋 글자 리스트 전체 복사하기</button>
                        </div>
                    </div>
                    <!-- 3. CSS 전용 unicode-range 코드 추출 -->
                    <div class="input-group-box">
                        <h3>3. 웹폰트 CSS 적용용 Unicode-Range</h3>
                        <div class="input-item">
                            <p class="guide-text">@font-face 스크립트 작성 시 브라우저 지연 로딩을 유도하는 css 속성입니다.</p>
                            <textarea id="unicode-range-area" rows="4" class="form-control" readonly></textarea>
                            <button type="button" id="btn-copy-unicode" class="btn green btn-block mt-2">📋 CSS 유니코드 범위 복사하기</button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="bottom-ad" class="bottom-ad" data-include="sub_bottom_ad.html"></div>
        </main>
        <div id="sidebar" data-include="sidebar.html"></div>
        <footer id="footer" data-include="footer.html"></footer>
    </div>
    <script src="/js/common.js"></script>
</body>
</html>
