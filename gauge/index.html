<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코바늘 게이지 계산기 - 단수 콧수 자동 변환</title>
    <meta name="description" content="뜨개질 편물의 게이지를 입력하면 원하는 사이즈에 필요한 콧수와 단수를 자동으로 계산해 주는 똑똑한 코바늘 계산기입니다.">
    <meta name="keywords" content="코바늘 게이지 계산기, 뜨개질 게이지 계산기, 대바늘 게이지 계산, 콧수 계산기, 단수 계산기, 게이지 계산 공식, 뜨개질 도안 변환">
    <link rel="canonical" href="https://every-calc.co.kr/gauge/">
    <meta name="robots" content="index, follow">
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="/css/gauge.css">
    <meta property="og:title" content="코바늘 게이지 계산기">
    <meta property="og:description" content="뜨개질 도안 바꿀 때 필수! 콧수와 단수를 오차 없이 계산해 보세요.">
    <meta property="og:image" content="https://every-calc.co.kr">
    <meta property="og:url" content="https://every-calc.co.kr/gauge/">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png">
    <link rel="apple-touch-icon" href="/apple-icon-180x180.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div id="wrap">
        <header id="header" data-include="header.html"></header>
        <div id="gnb" data-include="gnb.html"></div>
        <main id="content">
            <div class="calculator-box">
                <h2>🧶 코바늘 게이지 계산기</h2>
                <p>내 편물의 10cm 안의 콧수와 단수를 입력한 뒤, 만들고 싶은 옷/소품의 목표 사이즈를 적어주세요.</p>
                <form id="gauge-form" class="form" onsubmit="return false;">
                    <!-- 1. 현재 게이지 입력 (기준: 10cm x 10cm) -->
                    <div class="input-group-box">
                        <h3>1. 나의 게이지 (10cm 기준)</h3>
                        <div class="input-item">
                            <label for="sample-stitch">콧수 (st)</label>
                            <input type="number" id="sample-stitch" placeholder="예: 20" required min="1" step="0.1" class="form-control">
                            <label for="sample-row">단수 (row)</label>
                            <input type="number" id="sample-row" placeholder="예: 24" required min="1" step="0.1" class="form-control">
                        </div>
                    </div>
                    <!-- 2. 만들고 싶은 목표 사이즈 -->
                    <div class="input-group-box">
                        <h3>2. 만들고 싶은 목표 사이즈 (cm)</h3>
                        <div class="input-item">
                            <label for="target-width">가로 길이 (cm)</label>
                            <input type="number" id="target-width" placeholder="예: 50" required min="1" step="0.1" class="form-control">
                            <label for="target-height">세로 길이 (cm)</label>
                            <input type="number" id="target-height" placeholder="예: 40" required min="1" step="0.1" class="form-control">
                        </div>
                    </div>
                </form>
                <!-- 3. 실시간 결과 출력 영역 -->
                <div class="result-box">
                    <h3>💡 예상 작업 가이드</h3>
                    <div class="result-display">
                        <p>필요한 시작 콧수: <strong id="result-stitch">0</strong> 코</p>
                        <p>필요한 총 단수: <strong id="result-row">0</strong> 단</p>
                    </div>
                    <p class="result-tip guide-text mt-3">* 소수점 첫째 자리에서 반올림된 수치입니다.</p>
                </div>
            </div>
            <div id="bottom-ad" class="bottom-ad" data-include="sub_bottom_ad.html"></div>
        </main>
        <div id="sidebar" data-include="sidebar.html"></div>
        <footer id="footer" data-include="footer.html"></footer>
    </div>
    <script src="/js/common.js"></script>
    <script>
        // js/gauge.js
        document.addEventListener('DOMContentLoaded', () => {
            // DOM 요소 캐싱
            const sampleStitchInput = document.getElementById('sample-stitch');
            const sampleRowInput = document.getElementById('sample-row');
            const targetWidthInput = document.getElementById('target-width');
            const targetHeightInput = document.getElementById('target-height');

            const resultStitch = document.getElementById('result-stitch');
            const resultRow = document.getElementById('result-row');
            const gaugeForm = document.getElementById('gauge-form');

            // 계산 실행 함수
            function calculateGauge() {
                // 입력값 가져오기 (숫자형 변환)
                const sampleStitch = parseFloat(sampleStitchInput.value);
                const sampleRow = parseFloat(sampleRowInput.value);
                const targetWidth = parseFloat(targetWidthInput.value);
                const targetHeight = parseFloat(targetHeightInput.value);

                // 유효성 검사: 모든 값이 정상적으로 입력되었는지 확인
                if (!sampleStitch || !sampleRow || !targetWidth || !targetHeight) {
                    resultStitch.textContent = '0';
                    resultRow.textContent = '0';
                    return;
                }

                /**
                 * [코바늘 게이지 계산 공식]
                 * 10cm 기준이므로 1cm당 코/단수를 먼저 구한 뒤 목표 센티미터를 곱합니다.
                 * 콧수 = (나의 콧수 / 10) * 목표 가로 길이
                 * 단수 = (나의 단수 / 10) * 목표 세로 길이
                 */
                const totalStitches = (sampleStitch / 10) * targetWidth;
                const totalRows = (sampleRow / 10) * targetHeight;

                // 뜨개질 코/단수는 정수로 떨어져야 하므로 반올림(Math.round) 처리
                resultStitch.textContent = Math.round(totalStitches).toLocaleString();
                resultRow.textContent = Math.round(totalRows).toLocaleString();
            }

            // 폼 내부의 input 값이 변경될 때마다 실시간으로 계산 함수 호출
            gaugeForm.addEventListener('input', calculateGauge);
        });

    </script>
</body>
</html>
